name: Update GitHub contributions

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: write

concurrency:
  group: profile-contributions

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Refresh contributions and language statistics
        env:
          PROFILE_LANGUAGES_TOKEN: ${{ secrets.PROFILE_LANGUAGES_TOKEN }}
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 30 \
            'https://github.com/users/aymanebelkhiri/contributions' \
            --output "$RUNNER_TEMP/contributions.html"
          python3 - <<'PY'
          import json
          import os
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor
          import re
          import subprocess
          from datetime import date, datetime, timedelta, timezone
          from hashlib import sha256
          from math import hypot
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          from xml.sax.saxutils import escape

          calendar = (Path(os.environ['RUNNER_TEMP']) / 'contributions.html').read_text(encoding='utf-8')
          heading = re.search(
              r'id="js-contribution-activity-description"[^>]*>\s*([\d,]+)\s+contributions?\s+in the last year\s*</h2>',
              calendar,
          )
          if not heading:
              raise SystemExit('GitHub contribution total could not be read. Keeping the last verified value.')

          count = f"{int(heading.group(1).replace(',', '')):,}"
          def parse_days(markup):
              cells = {}
              for tag in re.findall(r'<td\b[^>]*>', markup):
                  attributes = dict(re.findall(r'([\w-]+)="([^"]*)"', tag))
                  if 'data-date' not in attributes or 'data-level' not in attributes:
                      continue
                  day = date.fromisoformat(attributes['data-date'])
                  level = int(attributes['data-level'])
                  if not 0 <= level <= 4 or day in cells:
                      raise SystemExit('Unexpected contribution calendar data.')
                  cells[day] = level
              return cells

          cells = parse_days(calendar)
          if not 360 <= len(cells) <= 371 or (max(cells) - min(cells)).days + 1 != len(cells):
              raise SystemExit('Expected a full year of daily contributions.')

          # The account was created in 2023. Use the rolling calendar for overlaps.
          history = dict(cells)
          for year in range(2023, min(cells).year + 1):
              first_day, last_day = date(year, 1, 1), date(year, 12, 31)
              if first_day >= min(cells):
                  break
              url = f'https://github.com/users/aymanebelkhiri/contributions?from={first_day}&to={last_day}'
              result = subprocess.run(
                  ['curl', '--fail', '--silent', '--show-error', '--retry', '3', '--max-time', '30', url],
                  check=True, capture_output=True, encoding='utf-8',
              )
              year_days = parse_days(result.stdout)
              expected_days = {first_day + timedelta(days=i) for i in range((last_day - first_day).days + 1)}
              if year_days.keys() != expected_days:
                  raise SystemExit(f'Incomplete calendar for {year}; keeping existing stats.')
              for day, level in year_days.items():
                  history.setdefault(day, level)

          today = datetime.now(timezone.utc).date()
          active_days = sorted(day for day, level in history.items() if level > 0 and day <= today)
          longest = current = chain = 0
          previous = None
          one_day = timedelta(days=1)
          for day in active_days:
              chain = chain + 1 if previous == day - one_day else 1
              longest = max(longest, chain)
              previous = day
          if previous in (today, today - one_day):
              current = chain

          def format_streak(days):
              return f'{days:,} day' if days == 1 else f'{days:,} days'

          first = min(cells)
          start = first - timedelta(days=(first.weekday() + 1) % 7)
          palette = ['#151b23', '#033a16', '#196c2e', '#2ea043', '#56d364']
          svg = [
              '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 220" width="870" height="220" role="img" aria-labelledby="title desc">',
              '<title id="title">GitHub contribution heatmap</title>',
              f'<desc id="desc">{count} contributions in the past 12 months, including eligible private activity.</desc>',
              '<rect x="1" y="1" width="868" height="218" rx="14" fill="#0d1117" stroke="#3d444d"/>',
              '<g font-family="system-ui, sans-serif">',
              '<text x="24" y="34" fill="#f0f6fc" font-size="19" font-weight="650">Contribution activity</text>',
              f'<text x="24" y="56" fill="#9198a1" font-size="13">{count} contributions in the past 12 months</text>',
          ]
          last_month_label = -100
          for day, level in sorted(cells.items()):
              week, weekday = divmod((day - start).days, 7)
              x, y = 54 + 15 * week, 85 + 14 * weekday
              if (day == first or day.day == 1) and x - last_month_label >= 38 and x < 822:
                  svg.append(f'<text x="{x}" y="77" fill="#9198a1" font-size="11">{day:%b}</text>')
                  last_month_label = x
              svg.append(f'<rect x="{x}" y="{y}" width="11" height="11" rx="2" fill="{palette[level]}"/>')
          for label, row in [('Mon', 1), ('Wed', 3), ('Fri', 5)]:
              svg.append(f'<text x="20" y="{94 + 14 * row}" fill="#9198a1" font-size="10">{label}</text>')
          svg.append('<text x="24" y="202" fill="#9198a1" font-size="11">Public and eligible private activity</text>')
          svg.append('<text x="703" y="202" fill="#9198a1" font-size="11">Less</text>')
          for index, color in enumerate(palette):
              svg.append(f'<rect x="{733 + index * 15}" y="192" width="11" height="11" rx="2" fill="{color}"/>')
          svg.append('<text x="811" y="202" fill="#9198a1" font-size="11">More</text>')
          svg.append('</g></svg>')
          graph_file = Path('assets/contribution-heatmap.svg')
          graph_file.parent.mkdir(exist_ok=True)
          graph_file.write_text('\n'.join(svg) + '\n', encoding='utf-8')
          # Sweep the same calendar grid in alternating directions each week.
          route = []
          for day, level in cells.items():
              week, weekday = divmod((day - start).days, 7)
              order = weekday if week % 2 == 0 else 6 - weekday
              route.append((week, order, 59.5 + 15 * week, 90.5 + 14 * weekday, level))
          route.sort()
          points = [(x, y) for _, _, x, y, _ in route]
          distance = [0.0]
          for (x1, y1), (x2, y2) in zip(points, points[1:]):
              distance.append(distance[-1] + hypot(x2 - x1, y2 - y1))
          motion = 'M ' + ' L '.join(f'{x} {y}' for x, y in points)

          animation = svg[:-1]
          animation[1] = '<title id="title">GitHub contribution snake</title>'
          animation[2] = f'<desc id="desc">An animated snake collects active days from the GitHub contribution calendar. {count} contributions in the past 12 months.</desc>'
          animation[5] = animation[5].replace('Contribution activity', 'Contribution snake')
          animation.insert(3, '<style>@media (prefers-reduced-motion: reduce) { .animated { display: none; } }</style>')
          animation.append('<g class="animated">')
          duration = '29s'
          for (_, _, x, y, level), travelled in zip(route, distance):
              if level == 0:
                  continue
              progress = min(0.999999, max(0.000001, travelled / distance[-1]))
              animation.append(
                  f'<rect x="{x - 5.5}" y="{y - 5.5}" width="11" height="11" rx="2" fill="{palette[0]}" opacity="0">'
                  f'<animate attributeName="opacity" values="0;1;1" keyTimes="0;{progress:.6f};1" calcMode="discrete" dur="{duration}" repeatCount="indefinite"/>'
                  '</rect>'
              )
          for delay, radius, color in [(0.24, 2.5, '#196c2e'), (0.18, 3, '#2ea043'), (0.12, 3.6, '#56d364'), (0.06, 4.2, '#7ee787'), (0, 5.2, '#aff5b4')]:
              animation.append(
                  f'<circle r="{radius}" fill="{color}">'
                  f'<animateMotion path="{motion}" begin="{delay}s" dur="{duration}" repeatCount="indefinite"/>'
                  '</circle>'
              )
          animation.append('</g></g></svg>')
          snake_file = graph_file.with_name('contribution-snake.svg')
          snake_file.write_text('\n'.join(animation) + '\n', encoding='utf-8')
          heatmap_version = sha256(graph_file.read_bytes()).hexdigest()[:12]
          snake_version = sha256(snake_file.read_bytes()).hexdigest()[:12]
          heatmap_asset = graph_file.with_stem(f'contribution-heatmap-{heatmap_version}')
          snake_asset = snake_file.with_stem(f'contribution-snake-{snake_version}')
          graph_file.replace(heatmap_asset)
          snake_file.replace(snake_asset)
          for pattern, current_asset in [('contribution-heatmap-*.svg', heatmap_asset), ('contribution-snake-*.svg', snake_asset)]:
              for old_asset in current_asset.parent.glob(pattern):
                  if old_asset != current_asset:
                      old_asset.unlink()
          def render_languages(token):
              def api(path):
                  request = Request('https://api.github.com' + path, headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'github-profile-language-stats',
                  })
                  with urlopen(request, timeout=15) as response:
                      return json.load(response)

              repositories = []
              page = 1
              while True:
                  batch = api(f'/user/repos?affiliation=owner&per_page=100&page={page}')
                  repositories.extend(repo for repo in batch if repo['owner']['login'].lower() == 'aymanebelkhiri' and not repo['fork'])
                  if len(batch) < 100:
                      break
                  page += 1
              if not any(repo['private'] for repo in repositories):
                  raise ValueError('The token must have private repository metadata access.')

              def repository_languages(repo):
                  return api('/repos/' + quote(repo['full_name'], safe='/') + '/languages')

              totals = Counter()
              with ThreadPoolExecutor(max_workers=4) as workers:
                  for breakdown in workers.map(repository_languages, repositories):
                      totals.update(breakdown)
              total = sum(totals.values())
              if total <= 0:
                  raise ValueError('GitHub returned no language bytes.')
              entries = sorted(totals.items(), key=lambda item: (-item[1], item[0]))
              top = entries[:7]
              if len(entries) > 7:
                  top.append(('Other', sum(size for _, size in entries[7:])))

              colors = palette[4:0:-1] + ['#238636', '#3fb950', '#7ee787', '#9198a1']
              parts = [
                  '<svg xmlns="http://www.w3.org/2000/svg" width="870" height="218" viewBox="0 0 870 218" role="img" aria-labelledby="title description">',
                  '<title id="title">Top Languages</title>',
                  '<desc id="description">Share of code bytes by language across owned non-fork repositories, including private repositories accessible to the read-only token.</desc>',
                  '<rect x="1" y="1" width="868" height="216" rx="14" fill="#0d1117" stroke="#3d444d"/>',
                  '<g font-family="system-ui, sans-serif" fill="#f0f6fc">',
                  '<text x="24" y="34" font-size="19" font-weight="650">Top Languages</text>',
                  '<text x="24" y="56" font-size="13" fill="#9198a1">Share of code bytes measured by GitHub · Public and accessible private repositories</text>',
                  '<defs><clipPath id="bar"><rect x="24" y="75" width="822" height="14" rx="7"/></clipPath></defs>',
                  '<g clip-path="url(#bar)">',
              ]
              x = 24.0
              for (_, size), color in zip(top, colors):
                  width = 822 * size / total
                  parts.append(f'<rect x="{x:.3f}" y="75" width="{width:.3f}" height="14" fill="{color}"/>')
                  x += width
              parts.append('</g>')
              for index, ((name, size), color) in enumerate(zip(top, colors)):
                  x = 24 + (index % 2) * 410
                  y = 114 + (index // 2) * 24
                  parts.append(f'<circle cx="{x + 6}" cy="{y - 4}" r="5" fill="{color}"/>')
                  parts.append(f'<text x="{x + 21}" y="{y}" font-size="13">{escape(name)}<tspan fill="#9198a1"> · {size / total:.1%}</tspan></text>')
              parts.append('</g></svg>')
              chart = ('\n'.join(parts) + '\n').encode()
              name = 'top-languages-' + sha256(chart).hexdigest()[:12] + '.svg'
              asset = graph_file.with_name(name)
              asset.write_bytes(chart)
              for old in asset.parent.glob('top-languages-*.svg'):
                  if old != asset:
                      old.unlink()
              return name

          readme = Path('README.md')
          original = readme.read_text(encoding='utf-8')
          language_asset = None
          token = os.environ.get('PROFILE_LANGUAGES_TOKEN')
          if token:
              try:
                  language_asset = render_languages(token)
              except (OSError, ValueError, KeyError) as error:
                  print(f'Top Languages refresh unavailable ({type(error).__name__}); keeping existing chart.')
          if language_asset is None:
              existing = re.search(r'/assets/(top-languages-[a-f0-9]{12}\.svg)', original)
              if existing and graph_file.with_name(existing.group(1)).is_file():
                  language_asset = existing.group(1)
          language_section = (
              f'![Top Languages by code bytes](https://raw.githubusercontent.com/aymanebelkhiri/aymanebelkhiri/main/assets/{language_asset})\n\n'
              if language_asset else 'Language percentages will appear once read-only private repository access is configured.\n\n'
          )
          graph = 'https://github.com/aymanebelkhiri#js-contribution-activity-description'
          section = (
              '## GitHub stats\n\n'
              f'**{count} contributions in the past 12 months** · Updated daily from GitHub.\n\n'
              '| Current streak | Longest streak since joining GitHub |\n'
              '| :--- | :--- |\n'
              f'| **{format_streak(current)}** | **{format_streak(longest)}** |\n\n'
              f'[![GitHub contribution heatmap showing {count} contributions](https://raw.githubusercontent.com/aymanebelkhiri/aymanebelkhiri/main/assets/{heatmap_asset.name})]({graph})\n\n'
              f'[![Animated contribution snake based on {count} GitHub contributions](https://raw.githubusercontent.com/aymanebelkhiri/aymanebelkhiri/main/assets/{snake_asset.name})]({graph})\n\n'
              f'[View the live contribution graph]({graph}). The total includes eligible private contributions as anonymized counts.\n\n'
              '## Top Languages\n\n'
              + language_section
          )
          updated, matches = re.subn(
              r'^## GitHub stats\n.*?(?=^## Technology stack\b)',
              lambda _: section,
              original,
              flags=re.MULTILINE | re.DOTALL,
          )
          if matches != 1:
              raise SystemExit('Expected exactly one GitHub stats section.')
          if updated != original:
              readme.write_text(updated, encoding='utf-8')
          PY
      - name: Publish the refreshed count
        run: |
          git add --all -- README.md assets
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh GitHub contribution stats'
          git push
